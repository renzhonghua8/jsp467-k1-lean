name: Lean verification

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596 # v1.6.0
        env:
          LEAN_NUM_THREADS: "1"
        with:
          build: true
          use-mathlib-cache: true
          use-github-cache: false
          leanchecker: true
          leanchecker-args: Jsp467
          axiom-audit: true
          axiom-audit-root: Jsp467
      - name: Print theorem axiom report
        run: lake env lean Jsp467/Audit.lean
      - name: Reject placeholders and custom axioms
        run: |
          ! grep -RInE '(^|[^[:alnum:]_])(sorry|admit|axiom|native_decide|Lean\.ofReduceBool)([^[:alnum:]_]|$)' \
            . --include='*.lean' --exclude-dir='.lake'
      - name: Verify release hashes
        run: sha256sum --check verification/SHA256SUMS
