name: Lean verification

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean toolchain
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --no-modify-path
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve pinned dependencies
        run: "$HOME/.elan/bin/lake update"
      - uses: leanprover/lean-action@v1
        env:
          LEAN_NUM_THREADS: "1"
        with:
          build: true
          use-mathlib-cache: true
          leanchecker: true
          leanchecker-args: Jsp467
          axiom-audit: true
          axiom-audit-root: Erdos577
      - name: Print theorem axiom report
        run: lake env lean Jsp467/Audit.lean
      - name: Reject placeholders and custom axioms
        run: |
          ! grep -RInE '(^|[^[:alnum:]_])(sorry|admit|axiom)([^[:alnum:]_]|$)' Jsp467 --include='*.lean'
